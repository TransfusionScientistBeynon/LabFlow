<!doctype html> 

<html>

<head> 
    <meta charset="UTF-8">
    <title> Laboratory Dashboard </title>
     <link rel="stylesheet" href="labView.viewRequest.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&display=swap" rel="stylesheet">
<!-- Google Fonts-->

<link rel="shortcut icon" href="#">
</head>

<body>


<div id ="headerBar" class="headerBar"> 
    <img id="appLogo" alt="LabDash" src="Images/labDashLogo7.png" class="headerLogo"> 
    
    <div id="navBar" class="navBar">
        <a href="index.html"> Home </a>
        
    </div>

</div>

    <div id="sectionHeader" class="sectionHeader">
         <h2> Full Request View </h2> 
    </div>

    <div class="communicationLogContainer">

    <div id="communicationLog" class="communicationLog">
        <button id="communicationButton" class="allRequestsButton" onclick='openCommunicationLog(communicationLogDate, communicationLogTime, communicationLogForm, totalClicks)'> Add Communication </button> </button>

        <form id="communicationLogForm" class="communicationLogFormInactive"> 

            
            <label for="date">  Date of communication:  </label>
            <input id="communicationLogDate" type="date">
            

            
            <label for="time"> Time of communication </label>
            <input id="communicationLogTime" type="time"> 
            

            
            <label for="communicationLogName"> Name of Contact:</label>
            <input id="communicationLogName" type="text" placeholder = "Please enter contact name..." />
            
            
            
                <label for="communicationLogDetails"> Conversation Details: </label>
                <textarea id="communicationLogDetails" type="text" placeholder= "Please enter conversation details..." >     </textarea>
                <label for="communicationLogAction"> Action Details: </label>
                <input id = "communicationLogAction" type="text" placeholder = "Please enter planned actions from conversation..." />
            
            <div id="communicationLogValidation" hidden class="validation">
                Please fill in all fields before submitting
            </div>
            
                    
                <input type="button" value="Submit" onclick="submitCommunicationlog()"/>

        </form>

    
    </div>
    <div id="communicationLogSuccessful" hidden class="success"> 
                New communication updated successfully!
            </div>

</div>

<div id = "requestContainer">

      


    <div id="fullRequestContainer" data-id="">

        
        <div id ="patientDemographics">
            

        </div>
        
        
        <div id="clinicalInformation">


        </div>

        <div id="hospitalInformation">


        </div>

        
        <div id="testRequestInformation">


        </div>


    </div>





    <div id="bottomMenu"> 
        <input id="labViewReturnButton" type="button" value="Return to all Requests" class="allRequestsButton" onclick="window.location.href='labview.html' ">   
        <input id="auditTrailButton" type="button" value="Audit Trail View" class="allRequestsButton" onclick = 'getAuditTrailView()'>   
        <input id="communicationLogButton" type="button" value="View Communication Log" class="allRequestsButton" onclick='getCommunicationLogView()'>
    </div>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.22/auth0-spa-js.production.js"></script>
    <script src="auth.js"></script>
    <script src="labview.viewRequest.JS"></script>

    
</body>









</html>
